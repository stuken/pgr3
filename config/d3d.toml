# XDK 2.0.2099.6 Direct3D, as statically linked into PGR3's default.xex (with
# title update 0.0.5.1 applied, which is what codegen and the runtime load).
#
# Matched against rr6's XDK 2135 names (rr6's config/d3d.toml) by instruction
# shape with scripts/re/match_names.py, then checked with funcdb.py. Most bodies
# are identical to 2135's apart from branch targets. The full layout, and how
# it was checked, is in src/gpu/d3d.h.
#
# Not named:
# - D3DTexture_LockRect, D3DCubeTexture_LockRect, D3DTexture_GetLevelDesc and
#   D3DVolumeTexture_GetLevelDesc: one-instruction tail calls that match
#   several thunks.
# - D3DDevice_CreateVertexBuffer/IndexBuffer: not linked. PGR3 builds its own
#   buffer headers (kCommonD3DCreated is clear on every live one).
# - D3DDevice_GetViewport, D3DDevice_GetRenderTarget and
#   D3DDevice_GetDepthStencilSurface (the best match, sub_823D1280, is
#   D3DDevice_InsertFence).
#
# 2099 has no D3DDevice_Present: the game's frame end (sub_821507A0) calls
# D3DDevice_Resolve (flags 0x300) and then D3DDevice_Swap itself. Swap has one
# other caller, sub_823DFC28, which nothing calls directly.
#
# Beyond rr6: D3DDevice_BeginTiling/EndTiling (predicated tiling; used in the
# front end, not in races), the query API (D3DDevice_CreateQuery, D3DQuery_*),
# XPhysicalAlloc/XPhysicalFree, D3DDevice_BeginShaderConstantF4 (constants
# written straight into the ring) and D3DDevice_SetPixelShaderConstantB (the
# bool file at +0x2780). PGR3 also overrides XMemAlloc and
# XMemFree: the D3D library allocates through sub_8219A778 and frees through
# sub_8219A170, so the XMemAlloc/XMemFree named here are the unused XDK
# defaults.
#
# D3DDevice layout (allocation 0x5080, as in 2135):
#   +0x0000..+0x3290  as in 2135: dispatch tables, fetch and float constants,
#                     every register shadow the render-state setters write,
#                     index buffer, render targets, depth, streams, textures,
#                     viewport, scissor, clip planes, pixel shader
#   +0x32AC           tile count (BeginTiling); the tiling state differs from 2135
#   +0x3524           command allocator callback (2135: +0x3534)
#   +0x4FD8           vertex shader (2135: +0x4FE8)
#   +0x5050           behaviour flags (2135: +0x5060)

[functions]
0x823C52B8 = { name = "XMemAlloc" }
0x823C5350 = { name = "XMemFree" }
0x823C5370 = { name = "XPhysicalAlloc" } # the only caller of MmAllocatePhysicalMemoryEx
0x823C53F8 = { name = "XPhysicalFree" } # MmFreePhysicalMemory (also called by Swap)
0x823C9DB0 = { name = "D3DDevice_SetVertexShaderConstantF" }
0x823C9EF8 = { name = "D3DDevice_SetPixelShaderConstantF" }
0x823CA040 = { name = "D3DDevice_SetPixelShaderConstantB" } # (dev, start, BOOL*, count): bit start+128 of the bool file at +0x2780
0x823CA098 = { name = "D3DPixelShader_Release" } # called by SetPixelShader
0x823CA150 = { name = "D3DVertexShader_Release" } # called by SetVertexShader
0x823CA208 = { name = "D3DDevice_SetPixelShader" }
0x823CA578 = { name = "D3DDevice_SetVertexShader" }
0x823CA5E0 = { name = "D3DDevice_CreateVertexDeclaration" }
0x823CA6A0 = { name = "D3DVertexDeclaration_Release" }
0x823CA760 = { name = "D3DDevice_SetShaderGPRAllocation" }
0x823CA810 = { name = "D3DDevice_CreatePixelShader" }
0x823CA900 = { name = "D3DDevice_CreateVertexShader" }
0x823CA9D8 = { name = "D3DDevice_SetVertexDeclaration" }
0x823CADB8 = { name = "D3DDevice_Swap" } # calls VdSwap
0x823CDAD8 = { name = "D3DDevice_SetScissorRect" }
0x823CDBA0 = { name = "D3DDevice_SetViewport" }
